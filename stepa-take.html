    { title: "⏳ Какое время выбрать?",
      text: "**Present Simple**: обычно, всегда (always, usually, every day): I take a shower every morning.\n**Present Continuous**: прямо сейчас (now, at the moment): I am taking a photo now.\n**Past Simple**: закончилось в прошлом (yesterday, last week, ago, then, suddenly): I took a photo yesterday.\n**Past Continuous** (was/were + -ing): длилось в какой-то момент в прошлом (at 5 pm yesterday, while): I was taking a shower at 7 pm.",

      mistake: "Не путай: was + -ing (was taking), а не was take / was took." },
    { title: "🐀 Past Simple или Past Continuous?",
      text: "Длинное действие (шло, длилось) → **Past Continuous**: was/were + глагол с -ing.\nКороткое действие, которое его прервало или случилось потом → **Past Simple**.\n**while** (пока) → обычно Past Continuous.\n**when, then, suddenly** (когда, потом, вдруг) → обычно Past Simple.",
      examples: ["While Stepa was taking a shower, the dog came in.", "Then he heard a funny sound.", "I was sleeping when the phone rang."],
      mistake: "❌ While I took a shower… → ✅ While I was taking a shower…\n❌ Then I was hear… → ✅ Then I heard…" },
    { title: "📚 Learning and exams",
      text: "take an exam: сдавать экзамен (писать его)\npass an exam: сдать экзамен (успешно)\nfail an exam: провалить экзамен\nrevise (for a test): повторять к контрольной\nlearn by heart: выучить наизусть\nget a good / bad mark: получить хорошую / плохую оценку\ncheat: списывать",
      examples: ["I'm revising for my test tomorrow.", "She passed all her exams!", "You mustn't cheat in a test."],
      mistake: "pass = успешно сдать! «Я сдаю экзамен (пишу его)» = I'm taking an exam." },
    { title: "📸 Expressions with take",
      text: "take a photo: сфотографировать\ntake a shower: принять душ\ntake a break: сделать перерыв\ntake the bus: поехать на автобусе\ntake notes: делать записи\ntake care of: заботиться о\ntake part in: участвовать в\ntake your time: не торопись",

    ["cheat", "списывать", "/tʃiːt/", ""],

      case: "Пропал фотоаппарат!",
      story: "Stepa wanted to take photos of his pets for a school project. But the camera disappeared! 😱 Ответь на вопросы, собери улики и найди, кто это сделал.",
      rule: [1, 3],
      steps: [
        { q: "At 5 pm Stepa ___ for his English test in his room.", o: ["was revising", "revised", "revises"], a: 0, clue: "🐾 На столе маленький-маленький след лапки!" },

        { q: "While the dog ___ in the garden, Stepa looked under the bed.", o: ["was playing", "played", "plays"], a: 0, clue: "🐶 Собака всё время была на улице, значит, это не она." },

        { q: "Stepa laughed: «You ___ take my things without asking!»", o: ["mustn't", "don't have to", "should"], a: 0, clue: "🔎 Дело раскрыто!" }

      suspects: [
