  ];
  function build() {
    if (document.getElementById("oge-audio")) return;
    var box = document.createElement("div");
    box.id = "oge-audio";
    box.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:99999;font-family:system-ui,sans-serif;";
    var list = REC.map(function (r) {
      return '<div style="margin-bottom:10px"><div style="font-weight:600;font-size:14px;margin-bottom:4px">' + r[0] + '</div>' +
        '<audio controls preload="none" playsinline src="' + r[1] + '" style="width:100%"></audio>' +
        '<div style="font-size:11px"><a href="' + r[1] + '" target="_blank" rel="noopener">не играет? открыть по ссылке</a></div></div>';
    }).join("");
    box.innerHTML =
      '<div id="oge-panel" style="display:none;background:#fff;border:2px solid #1b7f3b;border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);width:min(320px,calc(100vw - 20px));max-height:70vh;overflow:auto;box-sizing:border-box">' +
        '<div style="font-weight:700;color:#1b7f3b;margin-bottom:8px">🎧 ОГЭ Listening</div>' + list +
        '<div style="font-size:12px;color:#555">Каждую запись слушай 2 раза, без пауз.</div>' +
      '</div>' +
      '<button id="oge-btn" type="button" style="background:#1b7f3b;color:#fff;border:0;border-radius:24px;padding:10px 16px;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25)">🎧 ОГЭ Listening</button>';
    document.body.appendChild(box);
    document.getElementById("oge-btn").onclick = function () {
      var p = document.getElementById("oge-panel");
      p.style.display = p.style.display === "none" ? "block" : "none";
    };
    // одновременно играет только одна запись
    box.addEventListener("play", function (e) {
      box.querySelectorAll("audio").forEach(function (a) { if (a !== e.target) a.pause(); });
    }, true);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  setInterval(build, 1500);
})();
</script>
