<script>
(function () {

    "🎧 Запись 1.": "https://en-oge.sdamgia.ru/files/3013.mp3",

  function makePanel(key) {
    var url = AUDIO[key];
    var box = document.createElement("div");
    box.className = "nk-audio";
    box.style.cssText = "margin:10px 0 14px;padding:12px;border-radius:16px;background:rgba(31,138,76,.08);border:2px solid rgba(31,138,76,.35);";
    var au = document.createElement("audio");
    au.controls = true; au.preload = "none"; au.src = url;
    au.style.cssText = "width:100%;display:block;";
    au.addEventListener("play", function () {
      document.querySelectorAll(".nk-audio audio").forEach(function (x) { if (x !== au) x.pause(); });
    });
    box.appendChild(au);
    var link = document.createElement("a");
    link.href = url; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "Не включается? Открыть запись отдельно ↗";
    link.style.cssText = "display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:#1f6b3d;";
    box.appendChild(link);
    var note = document.createElement("div");
    note.style.cssText = "font-size:13px;opacity:.8;margin-top:6px;";
    note.textContent = "🔇 Нет звука? Переключи кнопку беззвучного режима сбоку на iPhone (чтобы не было оранжевой полоски) и прибавь громкость.";
    box.appendChild(note);
    return box;
  }

  function scan() {
    var els = document.body.getElementsByTagName("*");
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.closest && el.closest(".nk-audio")) continue;
      for (var key in AUDIO) {
        var own = false;
        for (var c = el.firstChild; c; c = c.nextSibling) if (c.nodeType === 3 && c.textContent.indexOf(key) >= 0) { own = true; break; }
        if (!own) continue;
        var anchor = el;
        if (anchor.parentElement && /flex|grid/.test(getComputedStyle(anchor.parentElement).display)) anchor = anchor.parentElement;
        var nx = anchor.nextElementSibling;
        if (nx && nx.classList && nx.classList.contains("nk-audio")) continue;
        anchor.insertAdjacentElement("afterend", makePanel(key));
      }
    }
  }

  var pending = false;
  function schedule() { if (pending) return; pending = true; setTimeout(function () { pending = false; scan(); }, 150); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", schedule); else schedule();
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
})();
</script>
