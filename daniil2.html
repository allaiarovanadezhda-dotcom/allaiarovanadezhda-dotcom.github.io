  var SAY = ["Good job!","Nice!","Wow!","Bug fixed! ✅","Cool!","Well done!","Super!","Level up! 🚀","Meow-velous!","Great code!","Yes!"];
  var st = document.createElement("style");
  st.textContent = "#memecat{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99999;pointer-events:none;opacity:0;transition:opacity .25s}"+
    "#memecat.on{opacity:1}#memecat .b{background:#fff;border:3px solid #16a34a;border-radius:22px;padding:14px 14px 10px;box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center;transform:scale(.6) rotate(-6deg);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}"+
    "#memecat.on .b{transform:scale(1) rotate(0)}#memecat img{display:block;max-width:58vw;max-height:42vh;border-radius:14px}"+
    "#memecat p{margin:8px 0 0;font:700 20px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#16a34a}";
  document.head.appendChild(st);
  var box = document.createElement("div"); box.id = "memecat";
  box.innerHTML = '<div class="b"><img alt=""><p></p></div>';
  document.body.appendChild(box);
  var order = [], timer = null;
  function next(){ if(!order.length){ order = CATS.map(function(_,i){return i}).sort(function(){return Math.random()-.5}); } return order.pop(); }
  function show(){
    box.querySelector("img").src = CATS[next()];
    box.querySelector("p").textContent = SAY[Math.floor(Math.random()*SAY.length)];
    clearTimeout(timer); box.classList.add("on");
    timer = setTimeout(function(){ box.classList.remove("on"); }, 2000);
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("button, [role=button], .btn");
    if(!b) return;
    var t = (b.textContent || "").toLowerCase();
    if (/telegram|подсказк|правил/.test(t)) return;
    if (/провер|check|готово/.test(t)) setTimeout(show, 600);
  }, true);
})();
