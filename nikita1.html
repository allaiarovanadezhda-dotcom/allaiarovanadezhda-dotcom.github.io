<style>

const WORDS=[
 {g:'👀 Appearance — What does he look like?',w:[
  ['tall','высокий'],['short','невысокий; короткие (волосы)'],['slim','стройный'],['thin','худой'],['overweight','полноватый, с лишним весом'],['bald','лысый'],['a beard','борода'],['a moustache','усы'],['curly','кудрявые (волосы)'],['straight','прямые (волосы)'],['blond / blonde','светлые волосы (blond — о мужчинах, blonde — о женщинах)'],['good-looking','привлекательный'],['handsome','красивый (о мужчине)']]},

 {id:1,tag:'MATCH 1',title:'Meet the team! Appearance',instr:'Нажми на слово, чтобы вставить его в пропуск (или напиши сам).',bank:['tall','bald','beard','moustache','blond','curly','overweight','slim'],items:[

 {id:4,tag:'MATCH 4',title:'Opposites',instr:'Найди противоположное слово. ⚠️ Два слова лишние.',bank:['mean','quiet','hard-working','stupid','unkind','unfriendly','serious','extrovert'],items:[

  {q:'lazy ↔ ___',a:['hard-working','hardworking']},
  {q:'clever ↔ ___',a:['stupid']},
  {q:'friendly ↔ ___',a:['unfriendly']},
  {q:'funny ↔ ___',a:['serious']}]},
 {id:5,tag:'MATCH 5',title:'Look like or like?',instr:'К какому вопросу подходит ответ? Выбери в списке.',type:'select',options:['What does he look like?','What\'s he like?'],items:[
  {q:'___ — He has short blond hair and blue eyes.',a:['What does he look like?']},
  {q:'___ — He\'s really talkative.',a:['What\'s he like?']},
  {q:'___ — He\'s bald and quite short.',a:['What does he look like?']},
  {q:'___ — He\'s generous and friendly.',a:['What\'s he like?']},
  {q:'___ — He has a moustache.',a:['What does he look like?']},
  {q:'___ — He\'s quite clever, but a bit lazy.',a:['What\'s he like?']}]},
 {tip:'<b>Present Simple:</b> he / she / it → глагол + <b>-s</b>: he play<b>s</b>, she watch<b>es</b>, he go<b>es</b>, she stud<b>ies</b>, he <b>has</b>.<br><b>Отрицание и вопрос:</b> he <b>doesn\'t</b> play (без -s!), <b>Does</b> he play? (без -s!)'},
 {id:6,tag:'MATCH 6',title:'Present Simple: don\'t forget -s!',instr:'Раскрой скобки. Помни про he / she / it.',items:[
  {q:'Nikita ___ (play) football every day.',a:['plays']},
  {q:'My dad ___ (watch) every match on TV.',a:['watches']},
  {q:'The coach ___ (go) to the stadium by bus.',a:['goes']},
  {q:'Our goalkeeper ___ (have) a big beard.',a:['has']},
  {q:'My brother ___ (study) in the 11th form.',a:['studies']},
  {q:'The team ___ (fly) to Spain every summer.',a:['flies']},
  {q:'Our striker ___ (wash) his boots after every match.',a:['washes']},
  {q:'My friends ___ (live) near the stadium.',a:['live']},
  {q:'She ___ (not / like) football.',a:['doesn\'t like','does not like']},
  {q:'___ (he / train) on Sundays?',a:['does he train']}]},
 {tip:'<b>am / is / are</b> — когда нет другого глагола: I <b>am</b> tired. He <b>is</b> tall. <b>Are</b> you shy?<br><b>do / does</b> — когда есть глагол: <b>Do</b> you play? He <b>doesn\'t</b> eat. <b>Does</b> she like…?<br>❌ I am eat → ✅ I eat &nbsp; ❌ I looking → ✅ I am looking (прямо сейчас)'},
 {id:7,tag:'MATCH 7',title:'am / is / are or do / does?',instr:'Выбери правильное слово.',type:'select',options:['am','is','are','do','does'],items:[
  {q:'___ you like football?',a:['do']},
  {q:'___ you tired after training?',a:['are']},
  {q:'___ your brother play football?',a:['does']},
  {q:'___ your coach strict?',a:['is']},
  {q:'I ___ not lazy!',a:['am']},
  {q:'He ___ not eat fast food.',a:['does']},
  {q:'They ___ from Moscow.',a:['are']},
  {q:'___ she have long hair?',a:['does']},
  {q:'What ___ he look like?',a:['does']},
  {q:'What ___ he like?',a:['is']}]},
 {id:8,tag:'MATCH 8',title:'VAR check: find the mistake 📺',instr:'В каждом предложении ошибка. Напиши предложение правильно.',wide:true,items:[
  {q:'I am eat breakfast at 8 every day.',a:['I eat breakfast at 8 every day','I eat breakfast at eight every day']},
  {q:'He play football on Saturdays.',a:['He plays football on Saturdays']},
  {q:'She don\'t like rainy matches.',a:['She doesn\'t like rainy matches']},
  {q:'I looking at the scoreboard now.',a:['I am looking at the scoreboard now']},
  {q:'My friend is live near the stadium.',a:['My friend lives near the stadium']},
  {q:'Do he have a beard?',a:['Does he have a beard']},
  {q:'He is not like fast food.',a:['He doesn\'t like fast food']},
  {q:'Are you play football?',a:['Do you play football']}]},
 {id:9,tag:'ОГЭ · ГРАММАТИКА',oge:true,title:'My football coach',instr:'Как в ОГЭ: преобразуй слово справа так, чтобы оно подходило по смыслу и грамматически.',items:[
  {q:'Mark Evans is my football coach. He ___ 35 years old.',k:'BE',a:['is']},

 {id:10,tag:'ОГЭ · СЛОВООБРАЗОВАНИЕ',oge:true,title:'Our new player',instr:'Как в ОГЭ: образуй от слова справа однокоренное слово, которое подходит по смыслу.',items:[
  {q:'Our team has a new player, Oleg. He is very ___ and talks to everybody.',k:'FRIEND',a:['friendly']},

];

const GRADED=TASKS.filter(t=>t.items);
const TOTAL=GRADED.reduce((s,t)=>s+t.items.length,0);
const state={};let celebrated=false;

function norm(s){
  s=(s||'').toLowerCase().replace(/[’‘`´]/g,"'");
  s=s.replace(/\bcan't\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not')
     .replace(/\bi'm\b/g,'i am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'ve\b/g,' have');
  return s.replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}

function renderWords(){
  const box=document.getElementById('words');
  WORDS.forEach(g=>{
    const c=document.createElement('section');c.className='card vgroup';
    c.innerHTML='<h3>'+g.g+'</h3>';
    g.w.forEach(([w,t])=>{
      const r=document.createElement('div');r.className='vrow';
      r.innerHTML='<span class="w">'+w+'</span><span class="t">'+t+'</span>';
      const b=document.createElement('button');b.className='say';b.textContent='🔊';b.onclick=()=>say(w.replace('/',','));
      r.appendChild(b);c.appendChild(r);
    });
    box.appendChild(c);
  });
}
function say(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

function renderTasks(){
  const root=document.getElementById('tasks');
  TASKS.forEach(t=>{
    if(t.tip){const d=document.createElement('div');d.className='tip';d.innerHTML='💡 '+t.tip;root.appendChild(d);return}
    const card=document.createElement('section');card.className='card';
    card.innerHTML='<div class="tag'+(t.oge?' oge':'')+'">'+t.tag+'</div><h2>'+t.title+'</h2><p class="instr">'+t.instr+'</p>';
    if(t.bank){
      const b=document.createElement('div');b.className='bank';t._chips=[];
      t.bank.forEach(w=>{const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=w;c.onclick=()=>insertWord(t,w,c);b.appendChild(c);t._chips.push(c)});
      card.appendChild(b);
    }
    const ol=document.createElement('ol');ol.className='items'+(t.oge?' oge':'');
    t._inputs=[];t._fbs=[];
    t.items.forEach(it=>{
      const li=document.createElement('li');
      if(it.k){const k=document.createElement('span');k.className='key';k.textContent=it.k;li.appendChild(k)}
      let f;
      if(t.type==='select'){f=document.createElement('select');f.innerHTML='<option value="">—</option>'+t.options.map(o=>'<option>'+o+'</option>').join('')}
      else{f=document.createElement('input');f.type='text';f.autocomplete='off';f.setAttribute('autocapitalize','off');f.spellcheck=false;if(t.wide)f.className='wide'}
      const parts=it.q.split('___');
      if(parts.length>1){li.append(document.createTextNode(parts[0]),f,document.createTextNode(parts[1]))}
      else{li.append(document.createTextNode(it.q),f)}
      const fb=document.createElement('span');fb.className='fb';li.appendChild(fb);
      f.addEventListener('focus',()=>t._last=f);
      f.addEventListener('input',()=>{f.classList.remove('ok','bad','empty');fb.textContent='';updateBank(t)});
      f.addEventListener('change',()=>{f.classList.remove('ok','bad','empty');fb.textContent=''});
      t._inputs.push(f);t._fbs.push(fb);ol.appendChild(li);
    });
    card.appendChild(ol);
    const btn=document.createElement('button');btn.className='check';btn.textContent='✅ Check';btn.onclick=()=>check(t);
    const res=document.createElement('div');res.className='res';t._res=res;
    card.append(btn,res);root.appendChild(card);
  });
}

function insertWord(t,w,chip){
  if(chip.disabled)return;
  let target=(t._last&&!t._last.value.trim())?t._last:t._inputs.find(f=>!f.value.trim());
  if(!target)return;
  target.value=w;target.classList.remove('ok','bad','empty');
  t._fbs[t._inputs.indexOf(target)].textContent='';
  updateBank(t);
  const next=t._inputs.find(f=>!f.value.trim());t._last=next||null;
}
function updateBank(t){
  if(!t._chips)return;
  const used=new Set(t._inputs.map(f=>norm(f.value)));
  t._chips.forEach(c=>c.disabled=used.has(norm(c.textContent)));
}

function check(t){
  const vals=t._inputs.map(f=>f.value.trim());
  if(vals.every(v=>!v)){
    t._inputs.forEach((f,i)=>{f.classList.remove('ok','bad');f.classList.add('empty');t._fbs[i].textContent='';t._fbs[i].className='fb'});
    t._res.textContent='Задание пустое — выполни его и попробуй ещё раз 💪';t._res.style.color='var(--empty)';return;
  }
  let s=0;const errors=[];
  t._inputs.forEach((f,i)=>{
    const it=t.items[i],fb=t._fbs[i];f.classList.remove('ok','bad','empty');
    if(!vals[i]){f.classList.add('empty');fb.textContent='Пусто — попробуй сам 💪';fb.className='fb empty';errors.push({q:it.q,k:it.k,u:'(пропуск)',a:'—'});return}
    if(it.a.map(norm).includes(norm(vals[i]))){s++;f.classList.add('ok');fb.textContent='✓ Great!';fb.className='fb ok'}
    else{f.classList.add('bad');fb.textContent='Правильно: '+it.a[0];fb.className='fb bad';errors.push({q:it.q,k:it.k,u:vals[i],a:it.a[0]})}
  });
  const prev=state[t.id];
  state[t.id]={s,total:t.items.length,checks:(prev?prev.checks:0)+1,errors};
  const n=t.items.length;
  t._res.textContent=s===n?'⚽ '+s+'/'+n+' — GOAL! Всё верно!':s+'/'+n+(s>=n*0.7?' — неплохо! Посмотри на ошибки.':' — разберись с ошибками и попробуй ещё раз.');
  t._res.style.color=s===n?'var(--ok)':'var(--ink)';
  updateScore();
}

function updateScore(){
  const got=GRADED.reduce((a,t)=>a+(state[t.id]?state[t.id].s:0),0);
  document.getElementById('score').textContent=got+' : '+TOTAL;
  if(!celebrated&&GRADED.every(t=>state[t.id]&&state[t.id].s===t.items.length)){celebrated=true;celebrate()}
}

function buildReport(){
  const got=GRADED.reduce((a,t)=>a+(state[t.id]?state[t.id].s:0),0);
  let r=STUDENT+' — HW '+TOPIC+'\nИтого: '+got+'/'+TOTAL+' ('+Math.round(got/TOTAL*100)+'%)\n\n';
  GRADED.forEach(t=>{const st=state[t.id];r+=t.title+': '+(st?st.s+'/'+st.total+' (проверок: '+st.checks+')':'не проверено (0/'+t.items.length+')')+'\n'});
  const errs=[];
  GRADED.forEach(t=>{const st=state[t.id];if(st)st.errors.forEach(e=>errs.push('['+t.title+'] '+e.q.replace('___','___')+(e.k?' ('+e.k+')':'')+' → '+e.u+' → '+e.a))});
  r+='\n❌ Ошибки и пропуски\n'+(errs.length?errs.join('\n'):'нет 🎉')+'\n';
  return r;
}
function showReport(){const r=buildReport();const box=document.getElementById('report');box.textContent=r;box.style.display='block';return r}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();return true}}
document.getElementById('copy').onclick=async()=>{const r=showReport();await copyText(r);alert('Отчёт скопирован! Вставь его в Telegram и отправь мне 🙂')};
document.getElementById('send').onclick=async()=>{
  const r=showReport();await copyText(r);
  if(navigator.share){try{await navigator.share({text:r});return}catch(e){}}
  window.open('https://t.me/share/url?url='+encodeURIComponent('HW')+'&text='+encodeURIComponent(r),'_blank');
};

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  const w=b.dataset.tab==='words';
  document.getElementById('words').classList.toggle('hidden',!w);
  document.getElementById('tasks').classList.toggle('hidden',w);
  document.getElementById('final').classList.toggle('hidden',w);
});

function celebrate(){
  const p=document.getElementById('party');p.style.display='block';
  const ball=document.getElementById('ball');ball.style.animation='none';void ball.offsetWidth;ball.style.animation='';
  const cv=document.getElementById('fw'),ctx=cv.getContext('2d');
  const fit=()=>{cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)};fit();
  const cols=['#ffd23f','#ffffff','#2fd158','#ff4d6d','#4dabff'];let parts=[],t0=performance.now();
  function burst(){const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.15+Math.random()*.4),c=cols[Math.random()*cols.length|0];
    for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*4.5;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c,s:Math.random()<.12})}}
  let last=0;
  (function loop(now){
    if(now-t0>1200&&now-last>380&&now-t0<7000){burst();last=now}
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.06;q.vx*=.985;q.l-=.012;ctx.globalAlpha=Math.max(q.l,0);
      if(q.s){ctx.font='14px serif';ctx.fillText('⚽',q.x,q.y)}else{ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,2.6,0,7);ctx.fill()}});
    parts=parts.filter(q=>q.l>0);ctx.globalAlpha=1;
    if(p.style.display==='block')requestAnimationFrame(loop);
  })(t0);
}
document.getElementById('close').onclick=()=>{document.getElementById('party').style.display='none'};

renderWords();renderTasks();
</script>
