<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Предпросмотр ДЗ</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff0f6;color:#4a2340;font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .box{max-width:420px;margin:20px;padding:26px 22px;background:#fff;border-radius:24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h1{font-size:24px;margin:0 0 8px;color:#ff4f9a}
  p{margin:8px 0}
  label{display:inline-block;margin-top:14px;padding:14px 26px;border-radius:999px;background:linear-gradient(135deg,#ff4f9a,#ffb3d1);color:#fff;font-weight:800;cursor:pointer}
  input{position:absolute;opacity:0;width:1px;height:1px}
  .small{font-size:14px;opacity:.7}
  #err{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>👀 Предпросмотр ДЗ</h1>
  <p>Выберите файл ДЗ из «Файлов» — он откроется здесь так, как его увидит ученик.</p>
  <label>📂 Выбрать файл ДЗ<input id="f" type="file" accept=".html,text/html"></label>
  <p id="err"></p>
  <p class="small">Файл никуда не загружается и ученику не виден. Ответы, которые вы введёте при проверке, остаются только на этом телефоне.</p>
</div>
<script>
document.getElementById("f").addEventListener("change", function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var r = new FileReader();
  r.onerror = function () { document.getElementById("err").textContent = "Не получилось прочитать файл."; };
  r.onload = function () {
    var html = String(r.result);
    if (!/HW\s*\(/.test(html)) { document.getElementById("err").textContent = "Это не файл ДЗ по шаблону. Выберите файл вида имя-тема.html"; return; }
    var back = '<script>(function(){var b=document.createElement("a");b.href=location.pathname;b.textContent="\\u2190 \\u0414\\u0440\\u0443\\u0433\\u043e\\u0439 \\u0444\\u0430\\u0439\\u043b";' +
      'b.style.cssText="position:fixed;left:10px;bottom:10px;z-index:999;background:#111;color:#fff;padding:8px 14px;border-radius:999px;font:700 14px sans-serif;text-decoration:none;opacity:.85";' +
      'document.body.appendChild(b);document.title="\\u041f\\u0440\\u0435\\u0434\\u043f\\u0440\\u043e\\u0441\\u043c\\u043e\\u0442\\u0440: "+document.title;})();<\/script>';
    html = html.indexOf("</body>") >= 0 ? html.replace("</body>", back + "</body>") : html + back;
    document.open(); document.write(html); document.close();
  };
  r.readAsText(file);
});
</script>
</body>
</html>
