/* ---------- Аудио для заданий ЕГЭ (вставляется в карточку задания) ---------- */
(function () {
  TASKS.forEach(function (t, i) {
    if (!t.audio) return;
    var card = document.getElementById("task-" + i);
    if (!card) return;
    var inner = card.querySelector(".inner"), body = card.querySelector(".body");
    if (!inner || !body) return;
    var box = document.createElement("div");
    box.style.cssText = "background:#fff;border:2px dashed #8b5cf6;border-radius:16px;padding:12px;margin:0 0 12px";
    var head = document.createElement("div");
    head.style.cssText = "font-weight:800;margin-bottom:8px";
    head.textContent = "🎧 Запись (слушай 2 раза, как на экзамене)";
    var au = document.createElement("audio");
    au.controls = true; au.preload = "none"; au.src = t.audio;
    au.setAttribute("playsinline", ""); au.style.cssText = "width:100%;display:block";
    var note = document.createElement("div");
    note.style.cssText = "font-size:14px;line-height:1.4;background:#f4efff;border-radius:10px;padding:8px 10px;margin-top:8px";
    note.textContent = "🔇 Если звук не включается — на iPhone переключи сбоку кнопку беззвучного режима (чтобы не было оранжевой полоски) и прибавь громкость кнопками сбоку. Если всё равно не играет — открой задание на «Решу ЕГЭ» по ссылке ниже и послушай там.";
    var link = document.createElement("a");
    link.href = t.page || t.audio; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "Открыть это аудирование на «Решу ЕГЭ» ↗";
    link.style.cssText = "display:inline-block;margin-top:8px;font-weight:700;color:#8b5cf6";
    box.appendChild(head); box.appendChild(au); box.appendChild(note); box.appendChild(link);
    inner.insertBefore(box, body);
  });
})();
</script>
</body></html>
